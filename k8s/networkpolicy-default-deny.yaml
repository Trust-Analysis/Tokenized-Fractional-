apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rwa-marketplace
  labels:
    app: rwa-marketplace
    component: network-policy
spec:
  # Default-deny both directions for every pod in the namespace (Issue #1094).
  # Workload-specific policies below and in the other files add back only the
  # flows each workload actually needs.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
