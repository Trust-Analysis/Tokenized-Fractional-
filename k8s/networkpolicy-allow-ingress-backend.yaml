apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: rwa-marketplace
  labels:
    app: rwa-backend
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: rwa-backend
  policyTypes:
    - Ingress
  ingress:
    # Public traffic is terminated by the nginx ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
    # Same-namespace callers (e.g. the frontend pod) may use the ClusterIP.
    - from:
        - podSelector:
            matchLabels:
              app: rwa-frontend
      ports:
        - protocol: TCP
          port: 3001
