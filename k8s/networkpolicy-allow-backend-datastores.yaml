apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-datastore-egress
  namespace: rwa-marketplace
  labels:
    app: rwa-backend
    component: network-policy
spec:
  podSelector:
    matchLabels:
      app: rwa-backend
  policyTypes:
    - Egress
  egress:
    # PostgreSQL: Render/ElastiCache-style external instances live outside the
    # cluster, so allow only the datastore port towards the private VPC range.
    # Replace 10.0.0.0/8 in an overlay with the actual DB subnet CIDR(s).
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
    # In-cluster PostgreSQL deployments are covered too when labelled this way.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis: cache, rate limiting and the WebSocket pub/sub bridge.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
