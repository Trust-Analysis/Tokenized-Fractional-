# ── Secret TEMPLATE — not applied by default ────────────────────────────────
#
# This file is NOT listed in k8s/kustomization.yaml and is never applied by
# `kubectl apply -k`. It exists only to document the shape of the two Secrets
# the Deployments expect (rwa-backend-secrets, rwa-frontend-secrets).
#
# Do NOT `kubectl apply -f` this file as-is: the values below are placeholders,
# not real secrets, and committing real values here would leak them in git
# history. See k8s/README.md#secret-provisioning for supported ways to
# provision these Secrets (External Secrets Operator, Sealed Secrets, SOPS, or
# a one-off `kubectl create secret generic`).
apiVersion: v1
kind: Secret
metadata:
  name: rwa-backend-secrets
  namespace: rwa-marketplace
  labels:
    app: rwa-backend
    component: secrets
type: Opaque
# Values must be base64-encoded. Example:
#   echo -n 'your-secret-value' | base64
# Replace the placeholder values below with your actual base64-encoded secrets.
stringData:
  ADMIN_API_KEY: "REPLACE_WITH_STRONG_RANDOM_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: rwa-frontend-secrets
  namespace: rwa-marketplace
  labels:
    app: rwa-frontend
    component: secrets
type: Opaque
# Replace the placeholder values below with your actual base64-encoded secrets.
stringData:
  VITE_CONTRACT_ID: "REPLACE_WITH_YOUR_CONTRACT_ID"
