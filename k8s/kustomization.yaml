# Kustomize base for the RWA Marketplace (Issue #890)
#
# This is the single source of truth for the Kubernetes manifests — the
# canonical manifests live right next to this file (namespace.yaml,
# backend-*.yaml, frontend-*.yaml, ingress.yaml) so the existing
# `kubectl apply -f k8s/<file>.yaml` instructions keep working.
#
# secrets.example.yaml is a TEMPLATE, not a resource here on purpose: no
# `kubectl apply -k` run (base or overlay) should ever create a Secret with
# placeholder values. Provision the real Secrets separately — see
# k8s/README.md#secret-provisioning.
#
# Never apply this base directly in an environment: apply an overlay instead,
# which parameterizes the environment-specific values (ingress hostname,
# replica counts, image tags):
#   kubectl apply -k k8s/overlays/dev
#   kubectl apply -k k8s/overlays/staging
#   kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rwa-marketplace

resources:
  - namespace.yaml
  - backend-configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-serviceaccount.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - frontend-configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-serviceaccount.yaml
  - frontend-hpa.yaml
  - frontend-pdb.yaml
  - ingress.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow-dns.yaml
  - networkpolicy-allow-ingress-backend.yaml
  - networkpolicy-allow-ingress-frontend.yaml
  - networkpolicy-allow-backend-datastores.yaml
