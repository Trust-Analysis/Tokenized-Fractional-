# Staging overlay (Issue #890)
#   kubectl apply -k k8s/overlays/staging
# Values: single replica per service, staging hostname, `staging` image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../..

images:
  - name: rwa-backend
    newTag: staging
  - name: rwa-frontend
    newTag: staging

patches:
  - path: ingress-patch.yaml
  - path: backend-replicas-patch.yaml
  - path: frontend-replicas-patch.yaml
