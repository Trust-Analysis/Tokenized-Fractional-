apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwa-backend
  namespace: rwa-marketplace
  labels:
    app: rwa-backend
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rwa-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rwa-backend
        component: backend
    spec:
      serviceAccountName: rwa-backend
      automountServiceAccountToken: false
      # Run as non-root to match the existing Dockerfile security posture
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: rwa-backend
          # No default tag is pullable here on purpose — always apply via an
          # overlay (k8s/overlays/<env>), which pins a real, immutable tag
          # through its `images:` stanza. See k8s/README.md.
          image: rwa-backend:unset
          imagePullPolicy: IfNotPresent
          # Single deployed entry point — must match backend/package.json and the Dockerfile CMD
          command: ["node"]
          args: ["src/server.js"]
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rwa-backend-config
            - secretRef:
                name: rwa-backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
