services:
  # ── Backend API (Blue) ─────────────────────────────────────────────────────
  - type: web
    name: rwa-marketplace-backend-blue
    runtime: node
    rootDir: backend
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Pinned to match .nvmrc / .node-version and CI (node-version: 20)
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGINS
        sync: false   # set in Render dashboard
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATA_FILE
        value: data.json
      - key: CDN_URL
        sync: false   # set to your CDN base URL, e.g. https://cdn.example.com
      - key: ASSET_CDN_URL
        sync: false   # optional override for uploaded image/document URLs
      - key: DEPLOYMENT_COLOR
        value: blue
      - key: SERVICE_NAME
        value: backend-blue
      # Structured JSON logs on stdout (issue #703). See docs/OBSERVABILITY.md
      # for the elk/ aggregation pipeline and the redaction guarantees.
      - key: LOG_LEVEL
        value: info
      # Error tracking / alerting. Set the DSN in the Render dashboard.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Optional — set in dashboard if using Redis
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: rwa-cache
      #     property: connectionString

  # ── Backend API (Green) ────────────────────────────────────────────────────
  - type: web
    name: rwa-marketplace-backend-green
    runtime: node
    rootDir: backend
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Pinned to match .nvmrc / .node-version and CI (node-version: 20)
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGINS
        sync: false   # set in Render dashboard
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATA_FILE
        value: data.json
      - key: CDN_URL
        sync: false   # set to your CDN base URL, e.g. https://cdn.example.com
      - key: ASSET_CDN_URL
        sync: false   # optional override for uploaded image/document URLs
      - key: DEPLOYMENT_COLOR
        value: green
      - key: SERVICE_NAME
        value: backend-green
      # Structured JSON logs on stdout (issue #703). See docs/OBSERVABILITY.md
      # for the elk/ aggregation pipeline and the redaction guarantees.
      - key: LOG_LEVEL
        value: info
      # Error tracking / alerting. Set the DSN in the Render dashboard.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ── Frontend (Static Site, Blue) ───────────────────────────────────────────
  - type: web
    name: rwa-marketplace-frontend-blue
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Pinned to match .nvmrc / .node-version and CI (node-version: 20)
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_CONTRACT_ID
        sync: false   # set in Render dashboard
      - key: VITE_RPC_URL
        value: https://soroban-testnet.stellar.org:443
      - key: VITE_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: VITE_API_URL
        value: https://rwa-marketplace-backend-blue.onrender.com
      - key: VITE_CDN_URL
        sync: false   # set to the CDN origin for static frontend assets
      # Issue #797: the independent public status page this build's footer links
      # to. Set it in the Render dashboard to wherever `status/` is deployed —
      # deliberately not the same service this page reports on.
      - key: VITE_STATUS_URL
        sync: false

  # ── Frontend (Static Site, Green) ──────────────────────────────────────────
  - type: web
    name: rwa-marketplace-frontend-green
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Pinned to match .nvmrc / .node-version and CI (node-version: 20)
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_CONTRACT_ID
        sync: false   # set in Render dashboard
      - key: VITE_RPC_URL
        value: https://soroban-testnet.stellar.org:443
      - key: VITE_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: VITE_API_URL
        value: https://rwa-marketplace-backend-green.onrender.com
      - key: VITE_CDN_URL
        sync: false   # set to the CDN origin for static frontend assets
      # Issue #797: the independent public status page this build's footer links
      # to. Set it in the Render dashboard to wherever `status/` is deployed —
      # deliberately not the same service this page reports on.
      - key: VITE_STATUS_URL
        sync: false
