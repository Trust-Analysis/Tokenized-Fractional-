# RWA Marketplace — full stack
#
# Dev mode  (hot-reload):  docker compose up
# Prod mode (built nginx): docker compose --profile prod up --build
# With Redis cache:        docker compose --profile redis up
# With Redis + TLS:        docker compose --profile redis-tls up
#
# Setup steps:
#   1. Copy backend/.env.example → backend/.env and fill in values.
#   2. Generate TLS certificates:  bash scripts/generate-certs.sh
#      (creates ./certs/  with CA, nginx, and Redis client certs)

services:

  # ── Express.js backend API ─────────────────────────────────────────────────
  backend:
    build: ./backend
    command: ["node", "${BACKEND_ENTRYPOINT:-src/server.js}"]
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-rwa_marketplace}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      # Persist data.json across restarts
      - backend-data:/app/data
      # Mount TLS certificates (read-only) — used for Redis mTLS and reference
      - ./certs:/etc/ssl/rwa:ro
    healthcheck:
      test: [\"CMD\", \"wget\", \"-qO-\", \"http://localhost:3001/health\"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [\"dev\", \"prod\"]

  # ── Dev frontend (Vite HMR) — default ──────────────────────────────────────
  frontend-dev:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_CONTRACT_ID: ${VITE_CONTRACT_ID:-C...}
      VITE_RPC_URL: ${VITE_RPC_URL:-https://soroban-testnet.stellar.org:443}
      VITE_NETWORK_PASSPHRASE: ${VITE_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_CDN_URL: ${VITE_CDN_URL:-}
    ports:
      - "5173:5173"
    volumes:
      # Mount source for live reloading; skip node_modules
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    profiles: [\"dev\"]

  # ── Prod frontend (built → nginx) ──────────────────────────────────────────
  frontend-prod:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_CONTRACT_ID: ${VITE_CONTRACT_ID:-C...}
        VITE_RPC_URL: ${VITE_RPC_URL:-https://soroban-testnet.stellar.org:443}
        VITE_NETWORK_PASSPHRASE: ${VITE_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
        VITE_API_URL: ${VITE_API_URL:-http://backend:3001}
        VITE_CDN_URL: ${VITE_CDN_URL:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount TLS certificates for Nginx TLS termination (read-only)
      - ./certs:/etc/ssl/rwa:ro
      # Nginx config with TLS directives
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # ACME challenge directory for Let's Encrypt / certbot renewals
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    profiles: [\"prod\"]

  # ── Redis — plain TCP (optional cache, no TLS) ─────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Disable persistence to minimise disk I/O for a pure cache
    command: redis-server --save \"\" --appendonly no
    ports:
      - \"6379:6379\"
    healthcheck:
      test: [\"CMD\", \"redis-cli\", \"ping\"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles: [\"redis\", \"prod\", \"dev\", \"ws-scale\"]

  # ── PostgreSQL — no default credentials; override via env ──────────────────
  # POSTGRES_USER and POSTGRES_PASSWORD must be provided; the compose file
  # ships no defaults so a database never boots with a published account
  # named `rwa_user`/`rwa_password`.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rwa_marketplace}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [\"CMD-SHELL\", \"pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}\"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: [\"prod\", \"dev\"]

  # ── Multi-node WebSocket delivery test (Issue #593) ────────────────────────
  # Simulates two horizontally-scaled backend nodes sharing one Redis
  # Pub/Sub channel and verifies that a broadcast on node A reaches a
  # client subscribed on node B.
  # Run with: docker compose --profile ws-scale up --build ws-multinode-test
  ws-multinode-test:
    build: ./backend
    restart: \"no\"
    environment:
      NODE_ENV: production
