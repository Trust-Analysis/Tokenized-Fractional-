name: Frontend Accessibility Tests
on:
  push:
    branches: [ main, dev ]
    paths: [ 'frontend/**', '.github/workflows/frontend-a11y.yml' ]
  pull_request:
    paths: [ 'frontend/**', '.github/workflows/frontend-a11y.yml' ]
jobs:
  # Issue #718: unit tests (Vitest + React Testing Library) for the frontend
  # components/hooks. Runs on the same `frontend/**` path filter as the a11y
  # suite so every frontend change is regression-checked without a browser.
  unit-tests:
    name: Frontend Unit Tests (Vitest + RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm test
  a11y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run A11y Tests
        working-directory: ./frontend
        run: npm run test:a11y
