name: Database Backup

# Scheduled offsite backup of the production database using GitHub OIDC.
#
# Required repository secrets / variables:
#   DATABASE_URL          PostgreSQL connection string of the production DB
#   BACKUP_S3_BUCKET      Target S3 bucket (with Versioning & Object Lock enabled)
#   AWS_BACKUP_ROLE_ARN   IAM Role ARN trusted by GitHub OIDC and scoped to BACKUP_S3_BUCKET
# Optional:
#   BACKUP_S3_PREFIX (default: backups), BACKUP_S3_REGION (default: us-east-1)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    name: Create & upload backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ secrets.BACKUP_S3_REGION || 'us-east-1' }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Install S3 client
        working-directory: backend
        run: npm install --no-save @aws-sdk/client-s3

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v pg_dump >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          pg_dump --version

      - name: Run backup
        working-directory: backend
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
        run: npm run backup

      - name: Upload backup artifact (retained 30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backend/backups/
          retention-days: 30
          if-no-files-found: warn
