name: Docker OpenAPI E2E Check

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  docker-openapi-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Build production Docker image
        run: |
          DOCKERFILE_PATH="Dockerfile"
          BUILD_CTX="."
          if [ ! -f "$DOCKERFILE_PATH" ] && [ -f "backend/Dockerfile" ]; then
            DOCKERFILE_PATH="backend/Dockerfile"
            BUILD_CTX="backend"
          fi
          docker build -f "$DOCKERFILE_PATH" -t rwa-api-e2e:local "$BUILD_CTX"

      - name: Start container and verify OpenAPI routes
        env:
          API_BASE_URL: http://127.0.0.1:3001
        run: |
          docker run -d --rm --name rwa-api-e2e \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -p 3001:3001 \
            rwa-api-e2e:local

          cleanup() {
            docker logs rwa-api-e2e || true
            docker stop rwa-api-e2e >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -sf "${API_BASE_URL}/api-docs.json" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          node scripts/verify-docker-openapi.mjs
