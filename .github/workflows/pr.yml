name: Pull Request Quality & Security

on:
  pull_request:
    branches: [ main, dev ]
  # Post-merge runs are limited to `main` (the release branch): every commit
  # reaching `main` was already tested by its pull_request run, and pushes to
  # `dev` arrive via PR merges that were gated the same way. Running the full
  # suite again on `dev` doubled every job for no additional signal.
  push:
    branches: [ main ]

# Cancel superseded runs on the same ref so a burst of pushes/PR updates does
# not pile up duplicate jobs. pull_request runs key on refs/pull/<n>/merge and
# push runs on refs/heads/<branch>, so a merged commit still gets one final
# post-merge run on `main` after its PR run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-eol-check:
    name: Node.js EOL Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify configured Node.js release line is supported
        run: node scripts/check-node-eol.mjs

  secret-scan:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          head: "${{ github.event.pull_request.head.sha || 'HEAD' }}"
          # `--only-verified` is a boolean flag, so `--only-verified=false` is not
          # a way to turn it off: the action interpolates extra_args unquoted, so
          # the CLI received a bare `false` token and aborted with
          # "unexpected false" before scanning anything. Omitting the flag
          # already means "report unverified findings too", which is what this
          # job wants. See the sibling `secret-scanning` job in security.yml,
          # which passes `--only-verified` bare and works.
          extra_args: --debug

  # Issue #907: Independent CI enforcement of Husky commit-msg hook (commitlint)
  commitlint:
    name: Commit Message Linting (commitlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install commitlint dependencies
        run: npm --no-audit --no-fund install --no-save @commitlint/cli@^19.6.0 @commitlint/config-conventional@^19.6.0

      - name: Validate PR commit messages against Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Validate latest commit message on push
        if: github.event_name == 'push'
        run: |
          npx commitlint --from "HEAD~1" --to "HEAD" --verbose || true

  # Issue #907: Independent CI enforcement of Husky pre-commit hook (linting/syntax checks)
  lint-check:
    name: Lint and Formatting Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository hygiene
        run: node scripts/check-repository-hygiene.mjs

      - name: Check tracked text encoding and line endings
        run: node scripts/check-text-encoding.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Syntax and lint validation (lint-staged equivalent)
        run: |
          node --check backend/index.js
          node --check backend/src/server.js
          node --check backend/src/app.js
          find backend/src -name '*.js' -exec node --check {} +
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('frontend/package.json'))"

