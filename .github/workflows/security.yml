name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  # The old `dependency-audit` job that lived here ran `npm audit` with
  # `continue-on-error: true` on every step, so it reported green no matter what
  # it found — a check that cannot fail is worse than no check, because it reads
  # as coverage. It never covered cargo either. Replaced by the enforcing
  # workflow in dependency-audit.yml (issue #721).

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  lint-security:
    name: Security Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install eslint-security plugin
        run: npm install --save-dev eslint-plugin-security
        working-directory: backend
      - name: Run security linting
        # Block scalar: the rule selector below contains ": ", which is not
        # valid inside a plain YAML scalar and made this workflow file
        # unparseable — taking every job in this file (including the
        # TruffleHog secret scan) down with it.
        run: >-
          npx eslint --plugin security
          --rule 'security/detect-object-injection: warn' src/
        working-directory: backend
        continue-on-error: true

  docker-image-scan:
    name: Backend Image Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t rwa-backend:ci -f backend/Dockerfile backend
      - name: Verify no tests/docs leaked into the image
        run: |
          docker create --name rwa-backend-ci rwa-backend:ci
          docker export rwa-backend-ci | tar -t > /tmp/image-files.txt
          docker rm -f rwa-backend-ci
          if grep -E '(^|/)(__tests__|test|tests|docs)/|\.md$' /tmp/image-files.txt; then
            echo "Found test/docs/markdown files in the runtime image" >&2
            exit 1
          fi
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rwa-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Test container HEALTHCHECK
        run: |
          docker run -d --name rwa-backend-health -p 3001:3001 rwa-backend:ci
          for i in $(seq 1 15); do
            status=$(docker inspect --format='{{.State.Health.Status}}' rwa-backend-health || echo "starting")
            echo "healthcheck status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs rwa-backend-health
              exit 1
            fi
            sleep 5
          done
          echo "Container never reported healthy" >&2
          docker logs rwa-backend-health
          exit 1

  sql-injection-tests:
    name: SQL Injection Prevention Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      # backend/package.json sets "type": "module" with no babel transform, so
      # jest can only load the ESM test files under --experimental-vm-modules.
      # The backend's own `npm test` script passes that flag; calling `npx jest`
      # directly (as this step did) did not, so the suite failed to parse with
      # "Cannot use import statement outside a module" before running a single
      # assertion. Reuse the package script so the two cannot drift apart.
      - name: Run SQL injection test suite (strict mode)
        run: npm test -- __tests__/sqlInjection.test.js --verbose
        working-directory: backend
        env:
          SQL_INJECTION_BLOCK_POLICY: strict
          NODE_ENV: test
      - name: Run SQL injection test suite (warn mode coverage)
        run: npm test -- __tests__/sqlInjection.test.js --verbose
        working-directory: backend
        env:
          SQL_INJECTION_BLOCK_POLICY: warn
          NODE_ENV: test
