name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to trigger the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser (if frontend), Node.js version, Rust version, Soroban CLI version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots / logs
      description: Any relevant error messages, console output, or screenshots.
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Cosmetic
        - Functional
        - Crash
        - Security (use the security advisory form instead — see config.yml)
    validations:
      required: true
