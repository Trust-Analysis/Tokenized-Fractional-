name: Documentation request
description: Report missing, unclear, or outdated documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Which doc/page/README, or which part of the code lacks documentation?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's missing or wrong
      description: What is unclear, missing, or out of date?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: What should the docs say instead?
    validations:
      required: false
