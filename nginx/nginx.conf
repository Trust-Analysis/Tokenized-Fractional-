events {
    worker_connections 1024;
}

http {
    default_type  application/octet-stream;

    # JSON log format for log aggregation (ELK / Filebeat)
    log_format json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"log_format":"json"'
    '}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log;

    # Rate limiting zone for API requests: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    # DDoS protection: max 50 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # ── Global security headers ───────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header X-XSS-Protection         "1; mode=block"  always;
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── HTTP server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge pass-through for Let's Encrypt / certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # DDoS protection
        limit_conn addr_limit 50;

        # Basic WAF rules
        if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zmap)) {
            return 403;
        }
        if ($query_string ~* "union.*select.*\(") {
            return 403;
        }
        if ($query_string ~* "concat.*\(") {
            return 403;
        }

        # ── JSON error pages ─────────────────────────────────────────────────
        # Return RFC 7807 application/problem+json for every nginx-generated
        # error so clients always receive JSON, matching the backend's own
        # error format.  The named location prevents proxy_intercept_errors
        # from swallowing backend error bodies that are already JSON.
        proxy_intercept_errors on;
        error_page 400 = @json_400;
        error_page 401 = @json_401;
        error_page 403 = @json_403;
        error_page 404 = @json_404;
        error_page 405 = @json_405;
        error_page 408 = @json_408;
        error_page 413 = @json_413;
        error_page 429 = @json_429;
        error_page 500 = @json_500;
        error_page 502 = @json_502;
        error_page 503 = @json_503;
        error_page 504 = @json_504;

        location @json_400 { default_type application/problem+json; return 400 '{"status":400,"title":"Bad Request","detail":"The request could not be understood by the server."}'; }
        location @json_401 { default_type application/problem+json; return 401 '{"status":401,"title":"Unauthorized","detail":"Authentication is required."}'; }
        location @json_403 { default_type application/problem+json; return 403 '{"status":403,"title":"Forbidden","detail":"You do not have permission to access this resource."}'; }
        location @json_404 { default_type application/problem+json; return 404 '{"status":404,"title":"Not Found","detail":"The requested resource was not found."}'; }
        location @json_405 { default_type application/problem+json; return 405 '{"status":405,"title":"Method Not Allowed","detail":"The HTTP method is not allowed for this resource."}'; }
        location @json_408 { default_type application/problem+json; return 408 '{"status":408,"title":"Request Timeout","detail":"The server timed out waiting for the request."}'; }
        location @json_413 { default_type application/problem+json; return 413 '{"status":413,"title":"Payload Too Large","detail":"The request body exceeds the size limit."}'; }
        location @json_429 { default_type application/problem+json; return 429 '{"status":429,"title":"Too Many Requests","detail":"Rate limit exceeded. Please retry after a moment."}'; }
        location @json_500 { default_type application/problem+json; return 500 '{"status":500,"title":"Internal Server Error","detail":"An unexpected error occurred."}'; }
        location @json_502 { default_type application/problem+json; return 502 '{"status":502,"title":"Bad Gateway","detail":"The upstream service returned an invalid response."}'; }
        location @json_503 { default_type application/problem+json; return 503 '{"status":503,"title":"Service Unavailable","detail":"The service is temporarily unavailable. Please retry."}'; }
        location @json_504 { default_type application/problem+json; return 504 '{"status":504,"title":"Gateway Timeout","detail":"The upstream service did not respond in time."}'; }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
