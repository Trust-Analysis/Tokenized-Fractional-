events {
    worker_connections 1024;
}

http {
    default_type  application/octet-stream;

    # JSON log format for log aggregation (ELK / Filebeat)
    log_format json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"log_format":"json"'
    '}';

    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log;

    # Rate limiting zone for API requests: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    # DDoS protection: max 50 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # ── Global security headers ───────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options          "SAMEORIGIN"     always;
    add_header X-XSS-Protection         "1; mode=block"  always;
    add_header X-Content-Type-Options   "nosniff"        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── HTTP server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge pass-through for Let's Encrypt / certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # DDoS protection
        limit_conn addr_limit 50;

        # Basic WAF rules
        if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zmap)) {
            return 403;
        }
        if ($query_string ~* "union.*select.*\(") {
            return 403;
        }
        if ($query_string ~* "concat.*\(") {
            return 403;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
