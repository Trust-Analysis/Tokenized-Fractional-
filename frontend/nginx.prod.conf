log_format json escape=json '{'
    '"time_local":"$time_local",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"log_format":"json"'
'}';

access_log /var/log/nginx/access.log json;
error_log /var/log/nginx/error.log;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security/hardening headers (closes #741). This SPA connects to a
    # browser wallet extension and a configurable backend/RPC origin, so
    # connect-src stays scoped to https:/wss: rather than a single fixed
    # domain (the deployed backend URL varies by environment). frame-src
    # 'none' + frame-ancestors 'none' + X-Frame-Options together block
    # both this app framing others and this app being framed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve pre-compressed assets when available
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
